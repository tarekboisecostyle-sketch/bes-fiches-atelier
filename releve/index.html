<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BES · Relevé de chantier</title>
<style>
  :root{--navy:#2E5A8E;--navy-dark:#1b3a5c;--amber:#F2B705;--ink:#16283d;--line:#d8dee7;--surface:#eef1f5;--white:#ffffff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--surface);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;}
  .app{display:flex;flex-direction:column;height:100%;}
  .topbar{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;padding:8px 12px;flex:0 0 auto;}
  .brand{display:flex;flex-direction:column;line-height:1.05;margin-right:4px;}
  .brand b{font-size:15px;letter-spacing:.3px;}.brand span{font-size:10px;opacity:.75;}
  .fields{display:flex;gap:10px;flex:1 1 auto;min-width:0;flex-wrap:wrap;}
  .field{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:8px;padding:4px 8px;min-width:0;}
  .field label{font-size:11px;opacity:.8;white-space:nowrap;}
  .field input{border:0;background:transparent;color:#fff;font-size:14px;padding:2px 0;min-width:70px;width:150px;max-width:34vw;outline:none;}
  .field input::placeholder{color:rgba(255,255,255,.55);}.field.date input{width:120px;}
  .actions{display:flex;gap:8px;flex:0 0 auto;}
  .btn{border:0;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn:active{transform:translateY(1px);}.btn.primary{background:var(--amber);color:#3a2c00;}.btn svg{width:16px;height:16px;}
  .stage{display:flex;flex:1 1 auto;min-height:0;}
  .rail{flex:0 0 auto;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;overflow-y:auto;}
  .tool{width:60px;height:54px;border-radius:12px;border:2px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);}
  .tool svg{width:22px;height:22px;}.tool span{font-size:10px;font-weight:600;}
  .tool.active{background:#fff;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,183,5,.22);}
  .tool.active svg{color:var(--navy);}.rail .sep{width:46px;height:1px;background:var(--line);margin:4px 0;}
  .canvas-col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .canvas-wrap{flex:1 1 auto;position:relative;min-height:0;background:var(--white);overflow:hidden;}
  canvas{position:absolute;inset:0;touch-action:none;display:block;cursor:crosshair;}
  .scalebar{position:absolute;left:12px;top:12px;display:none;align-items:center;gap:0;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--navy-dark);z-index:15;box-shadow:0 3px 10px rgba(0,0,0,.08);}
  .scalebar .sb-bar{height:8px;border-bottom:3px solid var(--navy-dark);border-left:2px solid var(--navy-dark);border-right:2px solid var(--navy-dark);margin-right:7px;}
  .ctxbar{position:absolute;display:none;gap:4px;background:var(--navy-dark);padding:4px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:20;}
  .ctxbar button{border:0;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .ctxbar button:active{transform:translateY(1px);}.ctxbar button.del{background:rgba(220,80,60,.85);}
  .legend{position:absolute;right:12px;bottom:12px;max-width:48%;max-height:52%;overflow:auto;background:rgba(255,255,255,.96);border:1px solid var(--navy);border-radius:12px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:15;display:none;}
  .legend .lg-head{font-weight:700;color:var(--navy-dark);margin-bottom:5px;font-size:13px;}
  .legend .lg-row{padding:3px 0;color:var(--ink);line-height:1.3;}.legend .lg-row b{display:inline-block;min-width:18px;color:var(--navy);}
  .bottombar{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--white);border-top:1px solid var(--line);padding:8px 12px;}
  .group{display:flex;align-items:center;gap:6px;}.group>.lbl{font-size:11px;color:#6b7a90;margin-right:2px;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
  .swatch.active{box-shadow:0 0 0 3px var(--amber);}
  .wbtn{width:40px;height:34px;border-radius:9px;background:var(--surface);border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .wbtn.active{border-color:var(--amber);background:#fff;}.wbtn i{display:block;background:var(--ink);border-radius:99px;width:22px;}
  .pill{display:flex;background:var(--surface);border-radius:9px;overflow:hidden;}
  .pill button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600;color:#5b6b80;cursor:pointer;}
  .pill button.on{background:var(--navy);color:#fff;}
  .mini{min-width:40px;height:38px;padding:0 6px;border-radius:9px;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:18px;font-weight:600;gap:5px;}
  .mini svg{width:20px;height:20px;}.mini:disabled{opacity:.35;}.mini.danger{color:#c0392b;}
  .mini.on{border-color:var(--amber);background:#fff8e3;color:var(--navy);}
  .mini .cnt{font-size:12.5px;font-weight:700;}
  #zoomLabel{font-size:12.5px;min-width:52px;}
  .spacer{flex:1 1 auto;}
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.35);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:18px;width:min(380px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 12px;font-size:16px;color:var(--navy-dark);}
  .modal .row{display:flex;align-items:center;gap:8px;}
  .modal input{flex:1 1 auto;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;outline:none;width:100%;}
  .modal input:focus{border-color:var(--navy);}.modal .unit{font-size:16px;color:#6b7a90;font-weight:600;}
  .modal .buttons{display:flex;gap:10px;margin-top:16px;}
  .modal .buttons button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .modal .cancel{background:var(--surface);color:#5b6b80;}.modal .ok{background:var(--navy);color:#fff;}
  .pmodal label{display:block;font-size:12px;color:#6b7a90;margin:10px 0 3px;}
  .pmodal .prow{display:flex;gap:8px;}.pmodal .prow>div{flex:1;}
  .pmodal .prow input{font-size:17px;padding:10px;text-align:center;}
  .pmodal #pName{font-size:18px;padding:12px;}
  #pUnitNote{font-size:11px;color:#8a97a8;margin-top:8px;text-align:right;}
  .hint{position:absolute;left:12px;bottom:12px;background:rgba(27,58,92,.85);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:16;}
  .hint.show{opacity:1;}
  a.brand{color:#fff;text-decoration:none}
  .field.hp input{width:64px}
  .sync{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap}
  .sync.ok{background:#2f6b3a}.sync.wait{background:#8a6d00}.sync.err{background:#b3261e}
  .legend .lg-row{display:flex;align-items:center;gap:6px}.legend .lg-row .tx{flex:1 1 auto}
  .legend .lg-row button{border:0;background:var(--navy);color:#fff;border-radius:7px;padding:5px 8px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .legend .lg-row .ty{font-size:10.5px;color:#6b7a90;margin-left:4px}
  .pmodal select{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff}
  .lmodal{width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column}
  .lmodal .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .lmodal .top button,.lmodal .top label{border:0;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--navy-dark)}
  .lmodal .top .new{background:var(--navy);color:#fff}
  .lmodal .list{overflow:auto;flex:1 1 auto;border-top:1px solid var(--line)}
  .lmodal .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .lmodal .it div{flex:1 1 auto;min-width:0}.lmodal .it small{color:#6b7a90}
  .lmodal .it button{border:0;border-radius:8px;padding:8px 12px;font-weight:600;background:var(--navy);color:#fff;cursor:pointer}
  .lmodal .it.cur{background:#fff8e3}
  .lmodal h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b7a90}
  @media (max-width:560px){.brand span{display:none;}.field.date{display:none;}.tool{width:54px;height:50px;}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="../" title="Retour aux fiches atelier"><b>← BES · Fiches</b><span>Relevé de chantier</span></a>
    <div class="fields">
      <div class="field"><label>Chantier</label><input id="fChantier" placeholder="Villa Sab3a…"></div>
      <div class="field"><label>Client</label><input id="fClient" placeholder="Nom du client"></div>
      <div class="field date"><label>Date</label><input id="fDate" type="date"></div>
      <div class="field hp"><label>H. plafond</label><input id="fHp" inputmode="decimal" placeholder="cm"></div>
    </div>
    <span class="sync" id="sync" title="État de l'enregistrement">—</span>
    <div class="actions">
      <button class="btn" id="btnOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg>Relevés</button>
      <button class="btn" id="btnSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7"/></svg>Enregistrer</button>
      <button class="btn primary" id="btnPng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l4-4 4 4 4-6 4 6"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Photo PNG</button>
    </div>
  </div>

  <div class="stage">
    <div class="rail" id="rail">
      <div class="tool" data-tool="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l7 17 2.5-6.5L21 11z"/></svg><span>Sélect.</span></div>
      <div class="tool" data-tool="pan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>Vue</span></div>
      <div class="sep"></div>
      <div class="tool" data-tool="scale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v5M15 8v3M19 8v5"/></svg><span>Échelle</span></div>
      <div class="tool" data-tool="pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1L20 7a2 2 0 0 0-3-3L5 16z"/></svg><span>Crayon</span></div>
      <div class="tool" data-tool="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/></svg><span>Ligne</span></div>
      <div class="tool" data-tool="rect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12"/></svg><span>Mur/Box</span></div>
      <div class="tool active" data-tool="dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8v8M21 8v8M3 12h18"/></svg><span>Cote</span></div>
      <div class="tool" data-tool="product"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h9l7 7-9 9-7-7z"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/></svg><span>Produit</span></div>
      <div class="tool" data-tool="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13"/></svg><span>Texte</span></div>
      <div class="sep"></div>
      <div class="tool" data-tool="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l7-7 6 6-4 4H8z"/><path d="M14 20h6"/></svg><span>Gomme</span></div>
    </div>

    <div class="canvas-col">
      <div class="canvas-wrap" id="wrap">
        <canvas id="cv"></canvas>
        <div class="scalebar" id="scalebar"></div>
        <div class="legend" id="legend"></div>
        <div class="ctxbar" id="ctxbar">
          <button data-a="fix" title="Corriger la forme">✦</button>
          <button data-a="edit" title="Modifier">✎</button>
          <button data-a="dup" title="Dupliquer">⧉</button>
          <button data-a="del" class="del" title="Supprimer">🗑</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="bottombar">
        <div class="group" id="colors"><span class="lbl">Couleur</span></div>
        <div class="group" id="widths"><span class="lbl">Trait</span></div>
        <div class="group"><span class="lbl">Unité</span>
          <div class="pill" id="unit"><button data-u="cm" class="on">cm</button><button data-u="m">m</button></div>
        </div>
        <div class="group"><span class="lbl">Assist.</span>
          <button class="mini on" id="tOrtho" title="Angle droit (traits H/V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4v15h15"/><path d="M5 10h5v5"/></svg></button>
          <button class="mini on" id="tMagnet" title="Aimant (accroche les extrémités)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></svg></button>
          <button class="mini on" id="tShape" title="Forme auto (redresse les croquis)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></button>
          <button class="mini" id="tAutoCote" title="Cotes auto (ajoute les mesures calculées)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8v8M21 8v8M3 12h18"/></svg></button>
        </div>
        <div class="group">
          <button class="mini" id="btnZoomOut" title="Dézoomer">−</button>
          <button class="mini" id="zoomLabel" title="Zoom 100%">100%</button>
          <button class="mini" id="btnZoomIn" title="Zoomer">+</button>
          <button class="mini" id="btnFit" title="Recadrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4"/></svg></button>
          <button class="mini" id="btnLegend" title="Liste des produits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="cnt" id="legendCnt">0</span></button>
          <button class="mini" id="btnGrid" title="Grille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
        </div>
        <div class="spacer"></div>
        <div class="group">
          <button class="mini" id="btnUndo" title="Annuler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
          <button class="mini" id="btnRedo" title="Rétablir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
          <button class="mini danger" id="btnClear" title="Tout effacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle">Dimension mesurée</h3>
    <div class="row"><input id="mInput" autocomplete="off"><span class="unit" id="mUnit">cm</span></div>
    <div class="buttons"><button class="cancel" id="mCancel">Annuler</button><button class="ok" id="mOk">Valider</button></div>
  </div>
</div>

<div class="overlay" id="povl">
  <div class="modal pmodal">
    <h3>Produit</h3>
    <label>Nom du produit</label>
    <input id="pName" placeholder="Placard chambre parents" autocomplete="off">
    <label>Type (pour la fiche atelier)</label>
    <select id="pType">
      <option value="placard">Placard / dressing</option>
      <option value="cuisine">Cuisine</option>
      <option value="tv">Meuble TV / étagères</option>
      <option value="meuble">Meuble sur mesure / ensemble</option>
      <option value="autre">Autre (porte, habillage…)</option>
    </select>
    <div class="prow">
      <div><label>Largeur</label><input id="pW" inputmode="decimal" placeholder="—"></div>
      <div><label>Hauteur</label><input id="pH" inputmode="decimal" placeholder="—"></div>
      <div><label>Prof.</label><input id="pD" inputmode="decimal" placeholder="—"></div>
      <div><label>Qté</label><input id="pQ" inputmode="numeric" value="1"></div>
    </div>
    <div id="pUnitNote">Dimensions en cm</div>
    <div class="buttons"><button class="cancel" id="pCancel">Annuler</button><button class="ok" id="pOk">Valider</button></div>
  </div>
</div>

<div class="overlay" id="lovl">
  <div class="modal lmodal">
    <h3>Relevés de chantier</h3>
    <div class="top">
      <button class="new" id="lNew">+ Nouveau relevé</button>
      <button id="lSync">Synchroniser</button>
      <button id="lExport">Télécharger (.json)</button>
      <button id="lImport">Ouvrir un fichier</button>
    </div>
    <div class="list" id="lList"></div>
    <div class="buttons"><button class="cancel" id="lClose">Fermer</button></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script>
"use strict";
const $ = s => document.querySelector(s);
const canvas=$('#cv'), ctx=canvas.getContext('2d'), wrap=$('#wrap');
let W=0,H=0,DPR=1;

let elements=[];
let history=[], future=[];
let current=null, tool='dim', color='#1b3a5c', lineW=4, unit='cm', showGrid=true, legendOn=true;
let selected=null, drag=null;
let scale=1, view={x:0,y:0};
const pointers=new Map();
let activePointer=null, gesture=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* échelle + assistants */
let pxPerCm=null;           // px monde par cm
let orthoOn=true, magnetOn=true, shapeOn=true, autoCoteOn=false;

$('#fDate').valueAsDate=new Date();

/* palette + widths */
const PALETTE=['#1b3a5c','#111827','#c0392b','#2563eb','#16a34a'];
const colorsBox=$('#colors');
PALETTE.forEach((c,i)=>{const s=document.createElement('div');s.className='swatch'+(i===0?' active':'');s.style.background=c;s.dataset.c=c;
  s.onclick=()=>{color=c;[...colorsBox.querySelectorAll('.swatch')].forEach(x=>x.classList.remove('active'));s.classList.add('active');
    if(tool==='select'&&selected){pushHistory();selected.color=c;redraw();}};colorsBox.appendChild(s);});
const widthsBox=$('#widths');
[{w:2,px:2},{w:4,px:4},{w:7,px:7}].forEach((o,i)=>{const b=document.createElement('div');b.className='wbtn'+(i===1?' active':'');b.dataset.w=o.w;
  const bar=document.createElement('i');bar.style.height=o.px+'px';b.appendChild(bar);
  b.onclick=()=>{lineW=o.w;[...widthsBox.querySelectorAll('.wbtn')].forEach(x=>x.classList.remove('active'));b.classList.add('active');
    if(tool==='select'&&selected){pushHistory();selected.w=o.w;redraw();}};widthsBox.appendChild(b);});

/* assistants toggles */
function tgl(id,get,set){const el=$(id);el.onclick=()=>{set(!get());el.classList.toggle('on',get());flash(el.title);};}
tgl('#tOrtho',()=>orthoOn,v=>orthoOn=v);
tgl('#tMagnet',()=>magnetOn,v=>magnetOn=v);
tgl('#tShape',()=>shapeOn,v=>shapeOn=v);
tgl('#tAutoCote',()=>autoCoteOn,v=>autoCoteOn=v);

/* tools */
$('#rail').addEventListener('click',e=>{const t=e.target.closest('.tool');if(!t)return;tool=t.dataset.tool;
  [...document.querySelectorAll('.tool')].forEach(x=>x.classList.remove('active'));t.classList.add('active');
  if(tool!=='select')selectEl(null);
  canvas.style.cursor=tool==='select'?'default':(tool==='pan'?'grab':'crosshair');
  flash({select:'Touche un élément pour le sélectionner',pan:'Glisse pour déplacer le plan',scale:'Trace une longueur connue, puis saisis sa vraie mesure',pen:'Croquis à main levée',line:'Trace un mur/segment',rect:'Trace un rectangle',dim:'Trace puis saisis la mesure',product:'Touche le plan pour ajouter un produit',text:'Touche pour ajouter une note',erase:"Touche un élément pour l'effacer"}[tool]);});

/* unit */
$('#unit').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;unit=b.dataset.u;
  [...$('#unit').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#mUnit').textContent=unit;$('#pUnitNote').textContent='Dimensions en '+unit;redraw();});

/* resize */
function resize(){const r=wrap.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=r.width;H=r.height;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';redraw();}
new ResizeObserver(resize).observe(wrap);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* coords */
function screenPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
function toWorld(sp){return{x:(sp.x-view.x)/scale,y:(sp.y-view.y)/scale};}
function pos(e){return toWorld(screenPos(e));}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function distToSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(p.x-a.x,p.y-a.y);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}

/* ── mesures / échelle ── */
function realCm(px){return px/pxPerCm;}
function fmtLen(px){if(!pxPerCm)return null;const cm=px/pxPerCm;return unit==='m'?(cm/100).toFixed(2).replace('.',',')+' m':Math.round(cm)+' cm';}
function lenValue(px){if(!pxPerCm)return '';const cm=px/pxPerCm;return unit==='m'?(cm/100).toFixed(2).replace('.',','):String(Math.round(cm));}

/* ── accroche + angle droit ── */
function allAnchors(){const a=[];for(const el of elements){if(el.type==='line'||el.type==='dim'){a.push({x:el.x1,y:el.y1},{x:el.x2,y:el.y2});}
  else if(el.type==='rect'){a.push({x:el.x1,y:el.y1},{x:el.x2,y:el.y1},{x:el.x2,y:el.y2},{x:el.x1,y:el.y2});}
  else if(el.type==='product'||el.type==='text'){a.push({x:el.x,y:el.y});}}return a;}
function snapAnchor(p){if(!magnetOn)return{x:p.x,y:p.y,snapped:false};const R=13/scale;let best=null,bd=R;
  for(const a of allAnchors()){const d=Math.hypot(a.x-p.x,a.y-p.y);if(d<bd){bd=d;best=a;}}return best?{x:best.x,y:best.y,snapped:true}:{x:p.x,y:p.y,snapped:false};}
function ortho(s,e){if(!orthoOn)return{x:e.x,y:e.y};const a=((Math.atan2(e.y-s.y,e.x-s.x)*180/Math.PI)%360+360)%360;
  const near=t=>Math.abs(((a-t+540)%360)-180)<8;
  if(near(0)||near(180))return{x:e.x,y:s.y};if(near(90)||near(270))return{x:s.x,y:e.y};return{x:e.x,y:e.y};}
function resolveEnd(s,raw,isRect){const sn=snapAnchor(raw);if(sn.snapped)return{x:sn.x,y:sn.y};return isRect?{x:raw.x,y:raw.y}:ortho(s,raw);}

/* ── nettoyage de forme ── */
function strokeLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return L;}
function maxPerp(pts,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;let m=0;for(const p of pts){const d=Math.abs((p.x-a.x)*dy-(p.y-a.y)*dx)/L;if(d>m)m=d;}return m;}
function ptsBBox(pts){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function cleanupPen(el){const pts=el.pts;if(pts.length<3)return el;const a=pts[0],b=pts[pts.length-1];
  const total=strokeLen(pts),chord=Math.hypot(b.x-a.x,b.y-a.y),closed=Math.hypot(a.x-b.x,a.y-b.y)<Math.max(26/scale,0.22*total),dev=maxPerp(pts,a,b);
  if(!closed&&chord>12/scale&&dev<Math.max(11/scale,0.11*chord)){let s={x:a.x,y:a.y},e={x:b.x,y:b.y};
    if(magnetOn){const ss=snapAnchor(s);if(ss.snapped)s=ss;const ee=snapAnchor(e);if(ee.snapped)e=ee;}const eo=ortho(s,e);
    return {type:'line',x1:s.x,y1:s.y,x2:eo.x,y2:eo.y,color:el.color,w:el.w};}
  const bb=ptsBBox(pts);
  if(closed&&bb.w>18/scale&&bb.h>18/scale){const th=Math.max(16/scale,0.14*Math.min(bb.w,bb.h));
    const near=pts.filter(p=>Math.min(Math.abs(p.x-bb.x),Math.abs(p.x-bb.x-bb.w),Math.abs(p.y-bb.y),Math.abs(p.y-bb.y-bb.h))<th).length/pts.length;
    if(near>0.70)return {type:'rect',x1:bb.x,y1:bb.y,x2:bb.x+bb.w,y2:bb.y+bb.h,color:el.color,w:el.w};}
  return el;}

/* ── cotes auto ── */
function mkDim(x1,y1,x2,y2){return {type:'dim',x1,y1,x2,y2,value:lenValue(Math.hypot(x2-x1,y2-y1)),color:'#1b3a5c',w:lineW};}
function autoDims(out){if(out.type==='line')return[mkDim(out.x1,out.y1,out.x2,out.y2)];
  const x1=Math.min(out.x1,out.x2),x2=Math.max(out.x1,out.x2),y1=Math.min(out.y1,out.y2),y2=Math.max(out.y1,out.y2);
  return[mkDim(x1,y2,x2,y2),mkDim(x1,y1,x1,y2)];}
function finishShape(out){if(autoCoteOn&&pxPerCm&&(out.type==='line'||out.type==='rect'))commitEls([out,...autoDims(out)]);else commit(out);}

/* ── produits ── */
function productsOf(){return elements.filter(e=>e.type==='product');}
function productNumber(el){return productsOf().indexOf(el)+1;}
function dimsStr(el){const parts=[el.w,el.h,el.d].map(v=>(v==null?'':(''+v).trim())).filter(v=>v!=='');let s=parts.join(' × ');if(s)s+=' '+unit;return s;}
function productText(el){let s=el.name||'Produit';const d=dimsStr(el);if(d)s+=' — '+d;const q=+el.qty;if(q>1)s+='  ×'+el.qty;return s;}
function escapeHtml(s){return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderLegend(){const prods=productsOf();$('#legendCnt').textContent=prods.length;
  const box=$('#legend');if(!prods.length||!legendOn){box.style.display='none';return;}
  box.style.display='block';box.innerHTML='<div class="lg-head">Produits ('+prods.length+')</div>'+
    prods.map((e,i)=>'<div class="lg-row"><b>'+(i+1)+'</b><span class="tx">'+escapeHtml(productText(e))+'<span class="ty">'+(PTYPE[e.ptype]||'')+'</span></span><button data-fiche="'+i+'" title="Créer ou ouvrir la fiche atelier de ce produit">Fiche →</button></div>').join('');}
const PTYPE={placard:'placard',cuisine:'cuisine',tv:'meuble TV',meuble:'meuble',autre:'autre'};
$('#legend').addEventListener('click',e=>{const b=e.target.closest('[data-fiche]');if(!b)return;goFiche(+b.dataset.fiche);});

/* ── dessin ── */
function drawGridWorld(g){const x0=(-view.x)/scale,y0=(-view.y)/scale,x1=(W-view.x)/scale,y1=(H-view.y)/scale;
  const sx=Math.floor(x0/20)*20,sy=Math.floor(y0/20)*20;g.save();g.lineWidth=1/scale;
  for(let x=sx;x<=x1;x+=20){g.strokeStyle=(Math.round(x)%100===0)?'#d3ddea':'#e6ecf3';g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();}
  for(let y=sy;y<=y1;y+=20){g.strokeStyle=(Math.round(y)%100===0)?'#d3ddea':'#e6ecf3';g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();}g.restore();}
function dimLabel(el){const v=(el.value||'').trim();if(/[a-zA-Z]/.test(v))return v;return v?v+' '+unit:'';}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawEl(g,el){g.save();g.strokeStyle=el.color;g.fillStyle=el.color;g.lineWidth=el.w||lineW;g.lineCap='round';g.lineJoin='round';
  if(el.type==='pen'){g.beginPath();el.pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();}
  else if(el.type==='line'){g.beginPath();g.moveTo(el.x1,el.y1);g.lineTo(el.x2,el.y2);g.stroke();}
  else if(el.type==='rect'){g.strokeRect(Math.min(el.x1,el.x2),Math.min(el.y1,el.y2),Math.abs(el.x2-el.x1),Math.abs(el.y2-el.y1));}
  else if(el.type==='scale'){g.setLineDash([7/scale,5/scale]);g.strokeStyle='#F2B705';g.lineWidth=Math.max(2,el.w||2);g.beginPath();g.moveTo(el.x1,el.y1);g.lineTo(el.x2,el.y2);g.stroke();g.setLineDash([]);}
  else if(el.type==='dim'){const{x1,y1,x2,y2}=el;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    const len=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/len,uy=(y2-y1)/len,px=-uy,py=ux,t=8;
    g.beginPath();g.moveTo(x1-px*t,y1-py*t);g.lineTo(x1+px*t,y1+py*t);g.moveTo(x2-px*t,y2-py*t);g.lineTo(x2+px*t,y2+py*t);g.stroke();
    const lab=dimLabel(el);if(lab){const mx=(x1+x2)/2,my=(y1+y2)/2;g.font='700 15px -apple-system,Segoe UI,Roboto,sans-serif';
      const tw=g.measureText(lab).width,pad=6,bw=tw+pad*2,bh=22;g.fillStyle='#fff';g.strokeStyle=el.color;g.lineWidth=1.5;
      roundRect(g,mx-bw/2,my-bh/2-px*10,bw,bh,6);g.fill();g.stroke();
      g.fillStyle=el.color;g.textAlign='center';g.textBaseline='middle';g.fillText(lab,mx,my-px*10);}}
  else if(el.type==='text'){g.font='600 '+(el.size||18)+'px -apple-system,Segoe UI,Roboto,sans-serif';g.textAlign='left';g.textBaseline='top';
    const tw=g.measureText(el.value).width;g.fillStyle='rgba(255,255,255,.85)';roundRect(g,el.x-4,el.y-3,tw+8,(el.size||18)+8,5);g.fill();
    g.fillStyle=el.color;g.fillText(el.value,el.x,el.y);}
  else if(el.type==='product'){const n=productNumber(el),col=el.color||'#2E5A8E';
    g.beginPath();g.arc(el.x,el.y,13,0,Math.PI*2);g.fillStyle=col;g.fill();g.lineWidth=2;g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#fff';g.font='700 14px -apple-system,Segoe UI,Roboto,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),el.x,el.y+0.5);
    if(el.name){g.font='600 14px -apple-system,Segoe UI,Roboto,sans-serif';g.textAlign='left';g.textBaseline='middle';
      const tw=g.measureText(el.name).width;g.fillStyle='rgba(255,255,255,.9)';roundRect(g,el.x+18,el.y-11,tw+10,22,6);g.fill();
      g.fillStyle=col;g.fillText(el.name,el.x+23,el.y+1);}}
  g.restore();}
function drawLenBadge(g,x,y,txt){if(!txt)return;g.save();g.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
  const tw=g.measureText(txt).width,pad=5,bw=tw+pad*2,bh=20;g.fillStyle='#fff';g.strokeStyle='#F2B705';g.lineWidth=1.5;
  roundRect(g,x-bw/2,y-bh/2,bw,bh,5);g.fill();g.stroke();g.fillStyle='#8a6d00';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x,y);g.restore();}
function drawLivePreview(g){if(!current)return;
  if(current.type==='scale'){const L=Math.hypot(current.x2-current.x1,current.y2-current.y1);
    drawLenBadge(g,(current.x1+current.x2)/2,(current.y1+current.y2)/2,'référence');return;}
  if(!pxPerCm)return;
  if(current.type==='line'){const L=Math.hypot(current.x2-current.x1,current.y2-current.y1);drawLenBadge(g,(current.x1+current.x2)/2,(current.y1+current.y2)/2,fmtLen(L));}
  else if(current.type==='rect'){const w=Math.abs(current.x2-current.x1),h=Math.abs(current.y2-current.y1);
    drawLenBadge(g,(current.x1+current.x2)/2,Math.max(current.y1,current.y2),fmtLen(w));
    drawLenBadge(g,Math.min(current.x1,current.x2),(current.y1+current.y2)/2,fmtLen(h));}
  else if(current.type==='dim'){const L=Math.hypot(current.x2-current.x1,current.y2-current.y1);drawLenBadge(g,(current.x1+current.x2)/2,(current.y1+current.y2)/2,fmtLen(L));}}
function drawWorld(g){if(showGrid)drawGridWorld(g);for(const el of elements)drawEl(g,el);}
function redraw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*scale,0,0,DPR*scale,view.x*DPR,view.y*DPR);
  drawWorld(ctx);if(current)drawEl(ctx,current);drawLivePreview(ctx);if(selected)drawSelection(selected);
  ctx.setTransform(DPR,0,0,DPR,0,0);updateHistoryBtns();positionCtxBar();renderLegend();updateScaleBar();scheduleSave();}

/* scale bar */
function updateScaleBar(){const el=$('#scalebar');if(!pxPerCm){el.style.display='none';return;}
  const spc=pxPerCm*scale;const cands=[1,2,5,10,20,25,50,100,200,500,1000,2000];let best=null,bd=1e9;
  for(const c of cands){const sl=c*spc;if(sl>=45&&sl<=170){const d=Math.abs(sl-95);if(d<bd){bd=d;best=c;}}}
  if(best==null){best=cands.reduce((p,c)=>Math.abs(c*spc-95)<Math.abs(p*spc-95)?c:p,cands[0]);}
  const sl=best*spc,label=best>=100?(best/100)+' m':best+' cm';
  el.style.display='flex';el.innerHTML='<span class="sb-bar" style="width:'+Math.max(20,sl)+'px"></span><span>'+label+'</span>';}

/* selection */
function bbox(el){if(el.type==='pen'){const xs=el.pts.map(q=>q.x),ys=el.pts.map(q=>q.y);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
  if(el.type==='text'){ctx.font='600 '+(el.size||18)+'px sans-serif';return{x:el.x,y:el.y,w:ctx.measureText(el.value).width,h:(el.size||18)};}
  if(el.type==='product'){ctx.font='600 14px sans-serif';const tw=el.name?ctx.measureText(el.name).width+28:0;return{x:el.x-13,y:el.y-13,w:26+tw,h:26};}
  const x=Math.min(el.x1,el.x2),y=Math.min(el.y1,el.y2);return{x,y,w:Math.abs(el.x2-el.x1),h:Math.abs(el.y2-el.y1)};}
function handles(el){if(el.type==='line'||el.type==='dim')return[{x:el.x1,y:el.y1},{x:el.x2,y:el.y2}];
  if(el.type==='rect')return[{x:el.x1,y:el.y1},{x:el.x2,y:el.y1},{x:el.x2,y:el.y2},{x:el.x1,y:el.y2}];return[];}
function handleAt(el,p){const hs=handles(el),r=16/scale;for(let i=0;i<hs.length;i++)if(Math.hypot(hs[i].x-p.x,hs[i].y-p.y)<r)return i;return -1;}
function setHandle(el,i,p){if(el.type==='line'||el.type==='dim'){if(i===0){el.x1=p.x;el.y1=p.y;}else{el.x2=p.x;el.y2=p.y;}}
  else if(el.type==='rect'){if(i===0){el.x1=p.x;el.y1=p.y;}else if(i===1){el.x2=p.x;el.y1=p.y;}else if(i===2){el.x2=p.x;el.y2=p.y;}else{el.x1=p.x;el.y2=p.y;}}}
function moveEl(el,dx,dy){if(el.type==='pen')el.pts.forEach(q=>{q.x+=dx;q.y+=dy;});else if(el.type==='text'||el.type==='product'){el.x+=dx;el.y+=dy;}else{el.x1+=dx;el.y1+=dy;el.x2+=dx;el.y2+=dy;}}
function drawSelection(el){const b=bbox(el),pad=6/scale;ctx.save();ctx.strokeStyle='#F2B705';ctx.lineWidth=1.5/scale;ctx.setLineDash([6/scale,4/scale]);
  ctx.strokeRect(b.x-pad,b.y-pad,b.w+pad*2,b.h+pad*2);ctx.setLineDash([]);const hs=6/scale;
  handles(el).forEach(h=>{ctx.fillStyle='#fff';ctx.strokeStyle='#F2B705';ctx.lineWidth=2/scale;ctx.beginPath();ctx.rect(h.x-hs,h.y-hs,hs*2,hs*2);ctx.fill();ctx.stroke();});ctx.restore();}
function isHit(el,p){const th=Math.max(12,(el.w||4)+8)/scale;
  if(el.type==='pen')return el.pts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<th);
  if(el.type==='line'||el.type==='dim')return distToSeg(p,{x:el.x1,y:el.y1},{x:el.x2,y:el.y2})<th;
  if(el.type==='product'){if(Math.hypot(el.x-p.x,el.y-p.y)<16/scale)return true;const b=bbox(el),m=4/scale;return p.x>b.x-m&&p.x<b.x+b.w+m&&p.y>b.y-m&&p.y<b.y+b.h+m;}
  if(el.type==='rect'){const b=bbox(el);return p.x>=b.x-th&&p.x<=b.x+b.w+th&&p.y>=b.y-th&&p.y<=b.y+b.h+th;}
  if(el.type==='text'){const b=bbox(el),m=6/scale;return p.x>b.x-m&&p.x<b.x+b.w+m&&p.y>b.y-m&&p.y<b.y+b.h+m;}return false;}
function hitTest(p){for(let i=elements.length-1;i>=0;i--)if(isHit(elements[i],p))return i;return -1;}
function selectEl(el){selected=el;positionCtxBar();}
function hideCtxBar(){$('#ctxbar').style.display='none';}
function positionCtxBar(){const bar=$('#ctxbar');if(!selected||drag||gesture){bar.style.display='none';return;}
  bar.querySelector('[data-a=edit]').style.display=(selected.type==='dim'||selected.type==='text'||selected.type==='product')?'':'none';
  bar.querySelector('[data-a=fix]').style.display=(selected.type==='pen'||selected.type==='line')?'':'none';
  bar.style.display='flex';const b=bbox(selected);const sx=b.x*scale+view.x,sy=b.y*scale+view.y,sh=b.h*scale;
  let left=sx-6,top=sy-6-48;if(top<4)top=sy+sh+10;left=Math.max(4,Math.min(left,W-bar.offsetWidth-4));top=Math.max(4,Math.min(top,H-48));
  bar.style.left=left+'px';bar.style.top=top+'px';}
$('#ctxbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!selected)return;const a=b.dataset.a;
  if(a==='del'){pushHistory();const i=elements.indexOf(selected);if(i>=0)elements.splice(i,1);selectEl(null);redraw();}
  else if(a==='dup'){pushHistory();const c=JSON.parse(JSON.stringify(selected));moveEl(c,16,16);elements.push(c);selectEl(c);redraw();}
  else if(a==='edit')editSelected();
  else if(a==='fix')fixSelected();});
function editSelected(){if(!selected)return;
  if(selected.type==='dim')askValue('Dimension mesurée',true,selected.value||'').then(v=>{if(v!=null){pushHistory();selected.value=v.trim();redraw();}});
  else if(selected.type==='text')askValue('Note / repère',false,selected.value||'').then(v=>{if(v!=null&&v.trim()){pushHistory();selected.value=v.trim();redraw();}});
  else if(selected.type==='product')askProduct(selected).then(p=>{if(p){pushHistory();Object.assign(selected,{name:p.name,ptype:p.ptype,w:p.w,h:p.h,d:p.d,qty:p.qty});redraw();}});}
function fixSelected(){if(!selected)return;
  if(selected.type==='pen'){const f=cleanupPen(selected);if(f!==selected){pushHistory();const i=elements.indexOf(selected);elements[i]=f;selectEl(f);redraw();flash('Forme corrigée');}else flash('Croquis conservé');}
  else if(selected.type==='line'){pushHistory();let s={x:selected.x1,y:selected.y1},e={x:selected.x2,y:selected.y2};
    if(magnetOn){const ss=snapAnchor(s);if(ss.snapped)s=ss;const ee=snapAnchor(e);if(ee.snapped)e=ee;}const eo=ortho(s,e);

/* pointer + gestures */
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,screenPos(e));
  if(pointers.size===2){current=null;drag=null;activePointer=null;const[a,b]=[...pointers.values()];
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};gesture={d:dist(a,b),s:scale,mw:toWorld(mid)};hideCtxBar();return;}
  if(pointers.size>2)return;
  activePointer=e.pointerId;const sp=screenPos(e),p=toWorld(sp);
  if(tool==='pan'){drag={mode:'pan',last:sp};canvas.style.cursor='grabbing';return;}
  if(tool==='select'){startSelect(p);return;}
  if(tool==='erase'){eraseAt(p);activePointer=null;return;}
  if(tool==='product'){askProduct(null).then(r=>{if(r)commit({type:'product',x:p.x,y:p.y,name:r.name,ptype:r.ptype,w:r.w,h:r.h,d:r.d,qty:r.qty,color:'#2E5A8E'});});activePointer=null;return;}
  if(tool==='text'){askValue('Note / repère',false,'').then(v=>{if(v!=null&&v.trim())commit({type:'text',x:p.x,y:p.y,value:v.trim(),size:18,color});});activePointer=null;return;}
  if(tool==='pen'){current={type:'pen',pts:[p],color,w:lineW};redraw();return;}
  // line / rect / dim / scale : point de départ accroché
  const s=snapAnchor(p);current={type:tool,x1:s.x,y1:s.y,x2:s.x,y2:s.y,color,w:lineW};redraw();});

canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,screenPos(e));
  if(gesture&&pointers.size>=2){const[a,b]=[...pointers.values()];const nd=dist(a,b),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    scale=clamp(gesture.s*(nd/gesture.d),0.2,8);view.x=mid.x-gesture.mw.x*scale;view.y=mid.y-gesture.mw.y*scale;updateZoom();redraw();return;}
  if(e.pointerId!==activePointer)return;const sp=screenPos(e),p=toWorld(sp);
  if(drag&&drag.mode==='pan'){view.x+=sp.x-drag.last.x;view.y+=sp.y-drag.last.y;drag.last=sp;redraw();return;}
  if(tool==='select'){if(drag)doDrag(p);return;}
  if(!current)return;
  if(current.type==='pen'){current.pts.push(p);redraw();return;}
  const en=resolveEnd({x:current.x1,y:current.y1},p,current.type==='rect');current.x2=en.x;current.y2=en.y;redraw();});

function endPointer(e){pointers.delete(e.pointerId);
  if(gesture){if(pointers.size<2)gesture=null;activePointer=null;redraw();return;}
  if(e.pointerId!==activePointer)return;activePointer=null;
  if(drag&&drag.mode==='pan'){drag=null;canvas.style.cursor='grab';return;}
  if(tool==='select'){if(drag)drag=null;positionCtxBar();return;}
  if(!current)return;const c=current;current=null;
  if(c.type==='pen'){if(c.pts.length>1){const out=shapeOn?cleanupPen(c):c;if(out!==c)finishShape(out);else commit(out);}else redraw();return;}
  if(c.type==='scale'){const L=Math.hypot(c.x2-c.x1,c.y2-c.y1);if(L<8/scale){redraw();return;}
    askValue('Longueur réelle de la référence',true,'').then(v=>{if(v!=null&&v.trim()){const val=parseFloat((''+v).replace(',','.'));
      if(val>0){const cm=unit==='m'?val*100:val;pxPerCm=L/cm;flash('Échelle définie : '+v+' '+unit);}}redraw();});return;}
  const moved=Math.hypot(c.x2-c.x1,c.y2-c.y1)>6/scale;if(!moved){redraw();return;}
  if(c.type==='dim'){const preset=pxPerCm?lenValue(Math.hypot(c.x2-c.x1,c.y2-c.y1)):'';
    askValue('Dimension mesurée',true,preset).then(v=>{if(v!=null&&v.trim()){c.value=v.trim();commit(c);}else redraw();});return;}
  finishShape(c);}

function zoomAt(f,cx,cy){const ns=clamp(scale*f,0.2,8);const wx=(cx-view.x)/scale,wy=(cy-view.y)/scale;view.x=cx-wx*ns;view.y=cy-wy*ns;scale=ns;updateZoom();redraw();}

  const pad=40,bw=(c-a)||1,bh=(d-b)||1;scale=clamp(Math.min((W-pad*2)/bw,(H-pad*2)/bh),0.2,8);
